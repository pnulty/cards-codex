<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Re:Enlightenment Breakout Cards</title>
    <link rel="stylesheet" href="/assets/mobile.css" />
  </head>
  <body>
    <main class="mobile-app">
      <section class="mobile-shell mobile-shell-chooser" id="chooser-screen">
        <div class="chooser-controls">
          <label class="sr-only" for="suit-select">Suit</label>
          <select id="suit-select" class="suit-select" aria-label="Choose suit"></select>
          <button type="button" class="pill-button draw-button" id="draw-suit-btn">Draw card</button>
        </div>
      </section>

      <section class="mobile-shell mobile-shell-card" id="card-screen" hidden>
        <header class="card-toolbar">
          <button type="button" class="pill-button ghost-button" id="back-to-suits-btn">Suit</button>
          <button type="button" class="pill-button" id="redraw-btn">Draw again</button>
        </header>

        <article class="mobile-card" id="mobile-card" tabindex="0" aria-live="polite">
          <div class="mobile-card-inner">
            <section class="mobile-card-face mobile-card-front">
              <div class="mobile-card-header">
                <p class="mobile-card-suit" id="card-suit"></p>
                <h2 class="mobile-card-name" id="card-name"></h2>
              </div>
              <p class="mobile-card-short" id="card-short"></p>
              <p class="mobile-card-text" id="card-text"></p>
            </section>

            <section class="mobile-card-face mobile-card-back">
              <div class="mobile-card-header">
                <p class="mobile-card-suit" id="back-card-suit"></p>
                <h2 class="mobile-card-name" id="back-card-name"></h2>
              </div>
              <div class="mobile-image-shell">
                <img id="card-image" class="mobile-card-image" alt="" hidden />
                <p id="image-empty" class="mobile-image-empty" hidden></p>
              </div>
            </section>
          </div>
        </article>
      </section>
    </main>

    <script type="module" src="/assets/mobile.js"></script>
  </body>
</html>
